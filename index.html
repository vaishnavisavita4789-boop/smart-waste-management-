<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Smart Waste Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root{--bg:#f4faf6;--cd:#fff;--tx:#14261a;--mu:#5f7466;--g:#16a34a;--bd:#e0ebe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root{--bgi:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2316a34a' stop-opacity='.2'/><stop offset='1' stop-color='%230ea5e9' stop-opacity='.1'/></linearGradient></defs><rect width='1200' height='800' fill='url(%23g)'/><circle cx='120' cy='120' r='160' fill='%2316a34a' fill-opacity='.08'/><circle cx='1100' cy='700' r='220' fill='%2316a34a' fill-opacity='.08'/><text x='600' y='420' font-size='150' font-weight='900' fill='%2316a34a' fill-opacity='.16' text-anchor='middle' font-family='Arial Black,Arial,sans-serif'>CLEAN INDIA</text><text x='600' y='500' font-size='38' fill='%2316a34a' fill-opacity='.28' text-anchor='middle' font-family='Arial,sans-serif'>Swachh Bharat - Report. Collect. Clean.</text></svg>")}
body{background:var(--bg) var(--bgi) center/cover fixed}
.hero{background:linear-gradient(135deg,rgba(6,95,70,.86),rgba(22,163,74,.72)),var(--bgi) center/cover}
#tg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:14px;z-index:50;border-radius:99px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:10px 14px;cursor:pointer;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
img.th,video{max-width:100%}
@media(max-width:800px){.side{position:sticky;top:0;z-index:5}main{padding:12px}.g{grid-template-columns:repeat(2,1fr)}.row>*{flex:1 1 140px}.hero{padding:36px 14px}table{display:block;overflow-x:auto}.side a{padding:8px 10px;font-size:14px}}
@media(max-width:480px){.stat b{font-size:24px}.wrap{padding:12px}}
</style></head><body><button id="tg" onclick="theme()" aria-label="Toggle theme">🌙</button><div id="app"></div><div id="toast"></div>
<script>
/* ===== DATA LAYER (swap DB/save() for fetch() calls to Express+SQLite later) ===== */
var DB,S={page:'landing'},H=[],IMG='',AI=null;const K='swm-v2',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ph=(t,c)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180"><rect width="300" height="180" fill="${c}"/><text x="150" y="95" font-size="22" fill="#fff" text-anchor="middle" font-family="sans-serif">${t}</text></svg>`);
const SS=['Submitted','Assigned','In Progress','Awaiting Verification','Resolved','Reopened'],PS=['Requested','Assigned','Pickup In Progress','Collected','Verified'];
function seed(){DB={s:0,u:[],c:[],p:[],b:[],n:[]};return DB}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Storage full - using memory only')}};
/* ===== SMART RULES ===== */
// Similar/duplicate detection: same location + same problem type, still open
const sim=c=>DB.c.filter(x=>x.id!=c.id&&x.prob==c.prob&&x.loc.trim().toLowerCase()==c.loc.trim().toLowerCase()&&x.status!='Resolved');
// Smart priority: transparent point rules (problem + waste + sensitive place + repeat reports)
function prio(c){let s={'Illegal Dumping':3,'Overflowing Bin':2,'Missed Collection':2}[c.prob]||1;s+=c.waste=='Hazardous'?4:c.waste=='Mixed'?1:0;
 if(/school|hospital|college|market/i.test(c.loc))s+=2;const n=sim(c).length;s+=n>=2?2:n>=1?1:0;return s>=6?'CRITICAL':s>=4?'HIGH':s>=2?'MEDIUM':'LOW'}
const PC={LOW:'#16a34a',MEDIUM:'#ca8a04',HIGH:'#ea580c',CRITICAL:'#dc2626'},badge=p=>`<span class="pb" style="background:${PC[p]}">${p}</span>`;
// Cleanliness score per AREA (service metric): fewer/pending/repeated/missed = lower
function area(a){const k=String(a).trim().toLowerCase(),cs=DB.c.filter(x=>x.area.trim().toLowerCase()==k),pend=cs.filter(x=>x.status!='Resolved').length,miss=cs.filter(x=>x.prob=='Missed Collection').length,dup=cs.length-new Set(cs.map(x=>x.loc+x.prob)).size,score=Math.max(0,100-cs.length*3-pend*4-miss*4-dup*3);
 return{a,n:cs.length,pend,res:cs.length-pend,score,lv:cs.length>=4?['🔴','HIGH']:cs.length>=2?['🟠','MEDIUM']:['🟢','LOW'],cl:score>=80?['🟢','Clean & Good']:score>=60?['🟡','Average']:['🔴','Bad Condition']}}
// DEMO SIMULATION of image classification - replace body with a fetch() to a real model later
async function classify(w){await new Promise(r=>setTimeout(r,1200));const m={Wet:['Wet / Organic Waste','Put in the green bin or compost it.'],Dry:['Dry Waste (paper/cardboard)','Keep dry and hand over in the dry-waste collection.'],Plastic:['Plastic / Dry Waste','Separate recyclable plastic from wet waste and dispose of it through the appropriate dry-waste collection channel.'],Hazardous:['Hazardous Waste','Do not touch. Keep away from people and wait for special handling.'],Mixed:['Mixed Waste','Segregate into wet and dry at source before collection.'],Other:['General Waste','Dispose in the nearest general bin.']}[w];return{label:m[0],conf:88+Math.floor(Math.random()*9),tip:m[1]}}
/* ===== HELPERS ===== */
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2600)};
const readImg=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,400/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=fr.result};fr.readAsDataURL(f)});
const cx=id=>DB.c.find(x=>x.id==id),cols=()=>DB.u.filter(u=>u.role=='collector'),stat=(l,v)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`;
const note=(uid,m)=>DB.n.unshift({uid,m,r:0,t:Date.now()});const binUrl=c=>location.href.split('#')[0]+'#bin='+c;
const tc=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const AL=()=>[...new Set(DB.c.map(x=>x.area))],ALo=()=>AL().map(x=>`<option>${esc(x)}</option>`).join('');
const noteA=m=>DB.u.filter(u=>u.role=='admin').forEach(a=>note(a.id,m));
const nextId=(arr,p)=>p+(arr.reduce((m,x)=>Math.max(m,+x.id.slice(2)),1000)+1);
function stats(){const c=DB.c,o=c.filter(x=>x.status!='Resolved');return{t:c.length,res:c.length-o.length,pend:o.length,hi:o.filter(x=>x.pri=='HIGH'||x.pri=='CRITICAL').length,pk:DB.p.length}}
const tl=c=>{const i={Submitted:0,Reopened:1,Assigned:2,'In Progress':3,'Awaiting Verification':3,Resolved:4}[c.status];return`<div class="tl">${['Submitted','Admin Reviewed','Collector Assigned','Cleaning in Progress','Resolved'].map((s,k)=>`<span class="${k<=i?'on':''}">${k<=i?'✓ ':''}${s}</span>`).join('')}</div>`};
function setSt(c,s){c.status=s;c.log.push([s,Date.now()]);const M={Assigned:'has been assigned to a collector.','In Progress':'cleaning is now in progress.','Awaiting Verification':'has been marked as resolved. Please verify whether the issue has actually been resolved.',Resolved:'is verified as resolved.',Reopened:'was reopened - verification required.'};
 if(M[s])note(c.uid,`Complaint ${c.id} ${M[s]}`);if(s=='Resolved'||s=='Reopened')noteA(`Citizen marked ${c.id} as ${s}.`);save();render()}
function assign(id){const c=cx(id),u=+$('#as'+id).value;c.col=u;note(u,`New task assigned: ${id} at ${c.loc}`);setSt(c,'Assigned');toast('Assigned to '+DB.u.find(x=>x.id==u).name)}
async function done(id){const f=$('#af'+id).files[0];if(!f)return toast('Upload an after-cleanup photo first');const c=cx(id);c.after=await readImg(f);setSt(c,'Awaiting Verification')}
const verify=(id,ok)=>{const c=cx(id);setSt(c,ok?'Resolved':'Reopened');toast(ok?'Thanks! Marked resolved':'Complaint reopened')};
function openC(id){const c=cx(id),m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="card"><h3>${c.id} ${badge(c.pri)}</h3><p>📍 ${esc(c.loc)}, ${c.area}<br>${esc(c.desc)}</p><div class="ba"><div>Before<img class="th" src="${c.img}"></div>${c.after?`<div>After<img class="th" src="${c.after}"></div>`:''}</div><p>Similar open reports: ${sim(c).map(x=>x.id).join(', ')||'none'}</p><button class="btn" onclick="this.closest('.modal').remove()">Close</button></div>`;document.body.appendChild(m)}
let STR=null;
async function setImg(u){IMG=u;$('#pv').innerHTML=`<img class="th" src="${u}">`;$('#ai').innerHTML='🔍 Analyzing image...';AI=await classify($('#w')?.value||'Mixed');
 $('#ai').innerHTML=`<div class="warn" style="background:#dcfce7;color:#14532d"><b>Detected:</b> ${AI.label} · <b>Confidence:</b> ${AI.conf}%<br><b>Suggestion:</b> ${AI.tip}</div>`}
async function pick(el){const f=el.files[0];if(f)await setImg(await readImg(f))}
// Live camera capture (needs https or localhost + user permission)
async function cam(){const fb=()=>$('#cf').click();if(!navigator.mediaDevices)return fb();
 try{STR=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#pv').innerHTML='<video id="vd" autoplay playsinline muted style="width:100%;max-width:320px;border-radius:12px"></video><div class="row"><button class="btn" onclick="snap()">📸 Capture</button><button class="btn o" onclick="stopCam()">Cancel</button></div>';$('#vd').srcObject=STR}catch(e){toast('Live camera blocked - opening phone camera/gallery instead');fb()}}
function stopCam(){STR&&STR.getTracks().forEach(t=>t.stop());STR=null;const e=$('#pv');if(e)e.innerHTML=''}
async function snap(){const v=$('#vd'),c=document.createElement('canvas'),k=Math.min(1,400/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);stopCam();await setImg(c.toDataURL('image/jpeg',.6))}
// Live location -> reverse geocode via OpenStreetMap Nominatim (free, needs internet + https/localhost)
async function loc(){const L=$('#lc');if(!navigator.geolocation){L.textContent='Location not supported - please type your area';return}L.textContent='Detecting...';
 navigator.geolocation.getCurrentPosition(async p=>{const a=p.coords.latitude,o=p.coords.longitude;let ar='';
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${a}&lon=${o}`),j=(await r.json()).address||{};ar=tc(j.suburb||j.neighbourhood||j.city_district||j.village||j.town||j.city||'')}catch(e){}
  if(!$('#l').value)$('#l').value=(ar?ar+' ':'')+'('+a.toFixed(4)+', '+o.toFixed(4)+')';if(ar)$('#ar').value=ar;
  L.textContent=ar?'Detected area: '+ar:'Location captured, but area name not found - please type your area'},
 e=>{L.textContent='Location blocked ('+(e.code==1?'permission denied':'unavailable')+'). Allow location in browser settings, open via https/localhost, or type your area.'},{enableHighAccuracy:true,timeout:10000})}
function addBin(){const l=$('#bl').value.trim(),a=tc($('#ba').value);if(!l||!a)return toast('Enter bin location and area');DB.b.push({code:'BIN-'+(1001+DB.b.length),loc:l,area:a,status:'Active'});save();render()}
function theme(t){const r=document.documentElement;t=t||((r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark');r.dataset.theme=t;try{localStorage.setItem('swm-theme',t)}catch(e){}$('#tg').textContent=t=='dark'?'☀️':'🌙'}
const BM={'Bin Full':'Overflowing Bin','Missed Pickup':'Missed Collection','Bin Damaged':'Damaged Bin','Wrong Segregation':'Other',Other:'Other'};
function sendReport(bin){const v=i=>$('#'+i).value.trim(),b=bin&&DB.b.find(x=>x.code==bin),loc=b?b.loc:v('l'),d=v('d');if(!loc||(!b&&!v('ar'))||d.length<5)return toast('Please enter location, area and a short description (5+ chars)');
 const c={id:nextId(DB.c,'WM'),uid:S.user.id,waste:v('w'),prob:b?BM[v('p')]:v('p'),loc,area:b?b.area:tc(v('ar')),desc:d,img:IMG||ph('No photo','#64748b'),after:'',col:0,bin:bin||'',status:'Submitted',at:Date.now(),log:[['Submitted',Date.now()]]};
 c.pri=prio(c);const s=sim(c);DB.c.unshift(c);noteA(`New complaint ${c.id} (${c.pri}) at ${loc}`);save();
 $('main').innerHTML=`<div class="card"><h2>✅ Complaint submitted successfully.</h2><p>Complaint ID: <b>${c.id}</b> ${badge(c.pri)}</p>${AI?`<p>Suggested category: <b>${AI.label}</b> (${AI.conf}%)</p>`:''}${s.length?`<div class="warn">Similar issue detected — ${s.length+1} citizens reported this problem.</div>`:''}<div class="row"><button class="btn" onclick="go('track')">Track Complaint</button><button class="btn o" onclick="go('dash')">Dashboard</button></div></div>`;IMG='';AI=null}
function sendPickup(){const v=i=>$('#'+i).value.trim();if(!v('pl')||!v('pd'))return toast('Location and preferred date are required');
 DB.p.unshift({id:nextId(DB.p,'PK'),uid:S.user.id,waste:v('pw'),qty:v('pq'),loc:v('pl'),date:v('pd'),desc:v('pn'),status:'Requested'});const p=DB.p[0];note(S.user.id,`Your pickup request ${p.id} is scheduled.`);noteA(`New pickup request ${p.id}`);save();toast('Pickup requested: '+p.id);go('pickup')}
/* ===== AUTH ===== */
function login(){const r=$('#lr').value,e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;if(!e||!p)return toast('Enter email/ID and password');
 const u=DB.u.find(x=>(x.email==e||(x.cid||'').toLowerCase()==e)&&x.password==p&&x.role==r);if(!u)return toast('Invalid credentials or wrong role selected');
 S.user=u;DB.s=u.id;save();S.page='app';S.view=r=='collector'?'tasks':'dash';S.arg=null;if(S.pend&&r=='citizen'){S.view='report';S.arg=S.pend}S.pend=null;render()}
function logout(){DB.s=0;save();S={page:'landing'};render()}
function register(){const r=S.rr||'citizen',v=i=>$('#r'+i).value.trim();if(v('n').length<2||!/^\S+@\S+\.\S+$/.test(v('e'))||!/^\d{10}$/.test(v('m'))||v('p').length<6||!/^\d{6}$/.test(v('z'))||!v('a')||!v('ar'))return toast('Check fields: valid email, 10-digit mobile, 6+ char password, area, 6-digit pincode');
 if(DB.u.some(u=>u.email==v('e').toLowerCase()))return toast('Email already registered');const cid={citizen:'CZN',admin:'ADM',collector:'COL'}[r]+(1001+DB.u.filter(u=>u.role==r).length);
 DB.u.push({id:Date.now(),name:v('n'),email:v('e').toLowerCase(),password:v('p'),role:r,address:v('a'),area:tc(v('ar')),cid});save();alert('Registered! Your '+r+' ID: '+cid);S.page='login';render()}
/* ===== PAGES ===== */
const NAV={citizen:[['dash','🏠','Dashboard'],['report','📸','Report Waste'],['pickup','🚛','Request Pickup'],['track','📍','Track Complaints'],['scan','📷','Scan Bin QR'],['clean','🧹','Area Cleanliness'],['guide','♻️','Waste Guide'],['notif','🔔','Notifications']],admin:[['dash','📊','Dashboard'],['queue','🚨','Priority Queue'],['hot','🔥','Hotspots'],['pick','🚛','Pickup Requests'],['bins','🗑️','Bins / QR'],['notif','🔔','Notifications']],collector:[['tasks','📋','My Tasks'],['done','✅','Completed'],['notif','🔔','Notifications']]};
const opts=a=>a.map(o=>`<option>${o}</option>`).join('');
const ccard=c=>`<div class="card">${badge(c.pri)} <b>${c.id}</b> · ${esc(c.prob)} · ${esc(c.loc)} <span class="st">${c.status}</span><p>${esc(c.desc)}</p>${tl(c)}${sim(c).length?`<div class="warn">Similar issue detected — ${sim(c).length+1} citizens reported this problem.</div>`:''}
 ${c.status=='Awaiting Verification'?`<div class="ba"><div>BEFORE<img class="th" src="${c.img}"></div><div>AFTER<img class="th" src="${c.after}"></div></div><p><b>Has the issue actually been resolved?</b></p><div class="row"><button class="btn" onclick="verify('${c.id}',1)">YES — Issue Resolved</button><button class="btn o" onclick="verify('${c.id}',0)">NO — Reopen Complaint</button></div>`:`<img class="th" src="${c.img}">`}</div>`;
const V={
'citizen.dash':()=>{const m=DB.c.filter(x=>x.uid==S.user.id),r=m.filter(x=>x.status=='Resolved').length;return`<h2>Welcome, ${esc(S.user.name)} 👋</h2><div class="g">${stat('Reports Submitted',m.length)}${stat('Issues Resolved',r)}${stat('Pickup Requests',DB.p.filter(x=>x.uid==S.user.id).length)}${stat('Active Complaints',m.length-r)}</div>
 <div class="g">${[['report','📸','Report Waste'],['pickup','🚛','Request Pickup'],['track','📍','Track Complaint'],['scan','📷','Scan Bin QR'],['clean','🧹','Area Cleanliness'],['guide','♻️','Waste Guide']].map(a=>`<div class="card act" onclick="go('${a[0]}')"><div class="big">${a[1]}</div><b>${a[2]}</b></div>`).join('')}</div>
 <div class="card"><h3>Your Cleanliness Impact</h3><p>You reported ${m.length} waste issues. ${r} have been resolved.</p><div class="bar"><i style="width:${m.length?r/m.length*100:0}%"></i></div></div>`},
'citizen.report':()=>{const bin=S.arg,b=bin&&DB.b.find(x=>x.code==bin),pr=b?Object.keys(BM):['Overflowing Bin','Garbage on Road','Illegal Dumping','Missed Collection','Damaged Bin','Other'];
 return`<h2>${b?'Report a problem with '+b.code:'Report Waste'}</h2><div class="card"><div class="g2"><div><label>Waste Type</label><select id="w">${opts(['Wet','Dry','Plastic','Hazardous','Mixed','Other'])}</select></div><div><label>Problem Type</label><select id="p">${opts(pr)}</select></div>
 <div><label>Location</label><input id="l" value="${b?esc(b.loc):''}" ${b?'readonly':''} placeholder="Street / landmark">${b?'':'<button class="btn o" style="margin-top:6px" onclick="loc()">📍 Use my live location</button> <small id="lc"></small>'}</div>${b?'':`<div><label>Area</label><input id="ar" list="al" value="${esc(S.user.area||'')}" placeholder="Enter your area"><datalist id="al">${ALo()}</datalist></div>`}</div>
 <label>Description</label><textarea id="d" rows="3"></textarea><label>Upload Image</label><div class="row"><button class="btn o" onclick="cam()">📷 Open Camera</button><input id="cf" type="file" accept="image/*" capture="environment" onchange="pick(this)" hidden><label class="btn o" style="margin:0;color:var(--g);font-size:14px">🖼️ Upload<input type="file" accept="image/*" onchange="pick(this)" hidden></label></div><div id="pv"></div><div id="ai"></div><div class="row"><button class="btn" onclick="sendReport('${bin||''}')">Submit Complaint</button></div></div>`},
'citizen.pickup':()=>{const m=DB.p.filter(x=>x.uid==S.user.id);return`<h2>Request Waste Pickup</h2><div class="card"><div class="g2"><div><label>Waste Type</label><select id="pw">${opts(['Wet','Dry','Plastic','Hazardous','Mixed','E-Waste'])}</select></div><div><label>Approximate Quantity</label><select id="pq">${opts(['Small bag','Medium','Large','Truckload'])}</select></div><div><label>Pickup Location</label><input id="pl"></div><div><label>Preferred Date</label><input id="pd" type="date"></div></div><label>Description</label><textarea id="pn" rows="2"></textarea><div class="row"><button class="btn" onclick="sendPickup()">Request Pickup</button></div></div>
 <h3>Your Requests</h3>${m.map(p=>`<div class="card"><b>${p.id}</b> · ${p.waste} · ${p.qty} · ${esc(p.loc)}<div class="tl">${PS.map((s,i)=>`<span class="${i<=PS.indexOf(p.status)?'on':''}">${s}</span>`).join('')}</div></div>`).join('')||'<div class="card">No pickup requests yet.</div>'}`},
'citizen.track':()=>{const m=DB.c.filter(x=>x.uid==S.user.id);return`<h2>Track Complaints</h2>${m.map(ccard).join('')||'<div class="card">🗑️ No complaints yet. Report your first issue!</div>'}`},
'citizen.scan':()=>`<h2>Scan Bin QR</h2><div class="card"><p>Scan the QR on any bin with your phone camera to open its report page, or pick a bin here:</p><select id="sb">${DB.b.map(b=>`<option value="${b.code}">${b.code} — ${b.loc}</option>`).join('')}</select><div class="row"><button class="btn" onclick="$('#sb').value?go('report',$('#sb').value):toast('No bins registered yet')">📷 Open Bin</button></div></div>`,
'citizen.guide':()=>{const G=[['🟢','Wet Waste','Food scraps, peels, garden waste','Use the green bin; compost if possible','Daily wet-waste collection'],['🔵','Dry Waste','Paper, cardboard, glass, metal','Keep clean and dry in the blue bin','Dry-waste collection'],['🟡','Plastic Waste','Bottles, wrappers, milk packets','Rinse and separate from wet waste','Recyclable plastic collection'],['🔴','Hazardous Waste','Paint, chemicals, expired medicines','Keep sealed and separate','Special hazardous pickup'],['🟣','E-Waste','Phones, chargers, batteries','Do not mix with household waste','Authorised e-waste centre']],
 I={'Banana peel':0,'Leftover food':0,'Newspaper':1,'Cardboard box':1,'Plastic bottle':2,'Milk packet':2,'Paint can':3,'Expired medicine':3,'Old phone':4,'Charger':4,'Battery':4};
 return`<h2>♻️ Waste Guide</h2><div class="g">${G.map(g=>`<div class="card"><h3>${g[0]} ${g[1]}</h3><small><b>Examples:</b> ${g[2]}<br><b>Segregation:</b> ${g[3]}<br><b>Disposal:</b> ${g[4]}</small></div>`).join('')}</div>
 <div class="card"><h3>Where does this waste belong?</h3><select onchange="const i=${JSON.stringify(I).replace(/"/g,"'")}[this.value];$('#gr').innerHTML=i>=0?'Goes to: <b>'+['🟢 Wet Waste','🔵 Dry Waste','🟡 Plastic Waste','🔴 Hazardous Waste','🟣 E-Waste'][i]+'</b>':''"><option value="">Select an item…</option>${opts(Object.keys(I))}</select><p id="gr"></p></div>`},
'admin.dash':()=>{const s=stats();H.push(()=>{if(!window.Chart)return;const cnt=(f)=>{const o={};DB.c.forEach(x=>{const k=f(x);o[k]=(o[k]||0)+1});return o},mk=(id,t,o,l)=>new Chart($('#'+id),{type:t,data:{labels:Object.keys(o),datasets:[{label:l,data:Object.values(o),backgroundColor:['#16a34a','#0ea5e9','#eab308','#ef4444','#8b5cf6','#f97316'],borderColor:'#16a34a',tension:.3}]},options:{plugins:{legend:{display:t=='doughnut'}}}});
 mk('c1','bar',cnt(x=>x.waste),'Complaints');mk('c2','bar',cnt(x=>x.area),'Complaints');mk('c3','doughnut',{Resolved:s.res,Pending:s.pend});const pk={};DB.p.forEach(p=>pk[p.status]=(pk[p.status]||0)+1);mk('c4','doughnut',pk);
 const tr={};for(let i=6;i>=0;i--)tr[new Date(Date.now()-i*864e5).toLocaleDateString('en',{day:'numeric',month:'short'})]=0;DB.c.forEach(x=>{const k=new Date(x.at).toLocaleDateString('en',{day:'numeric',month:'short'});if(k in tr)tr[k]++});mk('c5','line',tr,'Trend')});
 return`<h2>Admin Dashboard</h2><div class="g">${stat('Total Complaints',s.t)}${stat('Pending',s.pend)}${stat('High Priority',s.hi)}${stat('Resolved',s.res)}${stat('Pickup Requests',s.pk)}</div>
 <div class="g2">${[['c1','By Waste Type'],['c2','By Area'],['c3','Resolved vs Pending'],['c4','Pickup Requests'],['c5','Complaint Trend']].map(c=>`<div class="card"><b>${c[1]}</b><canvas id="${c[0]}" height="150"></canvas></div>`).join('')}</div>`},
'admin.queue':()=>{const o={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3},L=DB.c.filter(x=>x.status!='Resolved').sort((a,b)=>o[a.pri]-o[b.pri]||a.at-b.at);
 return`<h2>🚨 Priority Complaints</h2>${L.map(c=>`<div class="card">${badge(c.pri)} <b>${c.id}</b> — ${esc(c.prob)} · ${c.waste} — ${esc(c.loc)}${sim(c).length?`<div class="warn">⚠ Similar issue detected — ${sim(c).length+1} citizens reported this problem (Report Count: ${sim(c).length+1})</div>`:''}
 <div class="row"><span class="st">${c.status}</span><button class="btn o" onclick="openC('${c.id}')">View</button><select id="as${c.id}">${cols().map(u=>`<option value="${u.id}" ${u.id==c.col?'selected':''}>${u.name}</option>`).join('')}</select><button class="btn" onclick="assign('${c.id}')">Assign</button><select onchange="setSt(cx('${c.id}'),this.value)">${SS.map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join('')||'<div class="card">🎉 No pending complaints.</div>'}`},
'admin.hot':()=>`<h2>🔥 Waste Hotspots & Cleanliness Score</h2>${AL().length?'':'<div class="card">No area data yet.</div>'}<div class="g">${AL().map(area).sort((a,b)=>b.n-a.n).map(a=>`<div class="card"><h3>${a.lv[0]} ${a.a}</h3><p>${a.lv[1]} ACTIVITY — ${a.n} reports</p>Cleanliness: <b>${a.score}/100</b> — ${a.cl[0]} ${a.cl[1]}<div class="bar"><i style="width:${a.score}%"></i></div></div>`).join('')}</div>`,
'admin.pick':()=>`<h2>Pickup Requests</h2><div class="card"><table><tr><th>ID</th><th>Waste</th><th>Location</th><th>Status</th><th></th></tr>${DB.p.map(p=>`<tr><td>${p.id}</td><td>${p.waste}</td><td>${esc(p.loc)}</td><td>${p.status}</td><td>${p.status!='Verified'?`<button class="btn" onclick="const p=DB.p.find(x=>x.id=='${p.id}');p.status=PS[PS.indexOf(p.status)+1];note(p.uid,'Pickup '+p.id+' is now '+p.status);save();render()">Advance</button>`:'✓'}</td></tr>`).join('')}</table></div>`,
'admin.bins':()=>{H.push(()=>DB.b.forEach((b,i)=>window.QRCode&&new QRCode($('#q'+i),{text:binUrl(b.code),width:110,height:110})));return`<h2>🗑️ Bins / QR</h2><div class="card"><div class="g2"><input id="bl" placeholder="Bin location (street / landmark)"><input id="ba" placeholder="Area"></div><div class="row"><button class="btn" onclick="addBin()">➕ Add Bin</button></div></div>${DB.b.length?'':'<div class="card">No bins yet. Add one to generate its QR code.</div>'}<div class="g">${DB.b.map((b,i)=>`<div class="card"><b>${b.code}</b><p>${esc(b.loc)}</p><div id="q${i}"></div><a href="${binUrl(b.code)}" target="_blank">Open scan link</a></div>`).join('')}</div>`},
'collector.tasks':()=>{const L=DB.c.filter(x=>x.col==S.user.id&&['Assigned','In Progress','Reopened'].includes(x.status));return`<h2>Today's Tasks</h2>${L.map(c=>`<div class="card">${badge(c.pri)} <b>${c.id}</b> · ${esc(c.prob)} · ${esc(c.loc)} <span class="st">${c.status}</span><p>${esc(c.desc)}</p><div class="row"><button class="btn o" onclick="openC('${c.id}')">View Details</button><a class="btn o" target="_blank" href="https://www.openstreetmap.org/search?query=${encodeURIComponent(c.loc+', '+c.area)}">Navigate</a><button class="btn o" onclick="setSt(cx('${c.id}'),'In Progress')">Mark In Progress</button></div>
 <div class="row"><input type="file" id="af${c.id}" accept="image/*" style="width:auto"><button class="btn" onclick="done('${c.id}')">Mark Collected + Upload After Photo</button></div></div>`).join('')||'<div class="card">No tasks assigned yet.</div>'}`},
'collector.done':()=>`<h2>Completed</h2>${DB.c.filter(x=>x.col==S.user.id&&['Awaiting Verification','Resolved'].includes(x.status)).map(c=>`<div class="card"><b>${c.id}</b> · ${esc(c.loc)} <span class="st">${c.status}</span></div>`).join('')||'<div class="card">Nothing completed yet.</div>'}`,
};
V['citizen.notif']=V['admin.notif']=V['collector.notif']=()=>{const m=DB.n.filter(x=>x.uid==S.user.id);H.push(()=>{m.forEach(x=>x.r=1);save()});return`<h2>🔔 Notifications</h2>${m.map(x=>`<div class="card" style="${x.r?'':'border-color:var(--g)'}">${esc(x.m)}<br><small>${new Date(x.t).toLocaleString()}</small></div>`).join('')||'<div class="card">No notifications.</div>'}`};
V['citizen.clean']=()=>{const a=S.arg??S.user.area??'',r=a?area(a):null,col=r&&(r.score>=80?'#16a34a':r.score>=60?'#ca8a04':'#dc2626');
return`<h2>🧹 Your Area Cleanliness</h2><div class="card"><label>Enter your area</label><input id="ca" list="al" value="${esc(a)}" placeholder="e.g. Civil Lines"><datalist id="al">${ALo()}</datalist><div class="row"><button class="btn" onclick="go('clean',$('#ca').value.trim())">Check</button></div></div>
${r?`<div class="card" style="border-color:${col}"><h3>${esc(r.a)}</h3><p style="font-size:42px;margin:0;color:${col}"><b>${r.score}</b>/100</p><p style="font-size:20px">${r.cl[0]} ${r.cl[1]}</p><div class="bar"><i style="width:${r.score}%;background:${col}"></i></div><p>Reports: ${r.n} · Pending: ${r.pend} · Resolved: ${r.res}</p>${r.n?'':'<small>No complaints recorded for this area yet.</small>'}</div><div class="card"><small>80 and above = Clean & Good · 60 to 79 = Average · below 60 = Bad Condition</small></div>`:''}`};
const vLand=()=>{const s=stats(),r=s.t?s.pend/s.t:0,lv=r<.3?'🟢 Low Waste Activity':r<.6?'🟡 Moderate Waste Activity':'🔴 High Waste Activity';return`<div class="hero"><div style="letter-spacing:6px;font-weight:800">🇮🇳 CLEAN INDIA</div><h1>SMART WASTE MANAGEMENT</h1><h3>“Report. Collect. Clean.”</h3><p>A smarter way to report waste, manage collection and build cleaner communities.</p><button class="btn" onclick="S.page='login';render()" style="background:#fff;color:#065f46">Report Waste</button><button class="btn o" onclick="S.page='login';render()">Request Pickup</button><button class="btn o" onclick="S.page='login';render()">Login</button></div>
 <div class="wrap"><div class="tl" style="justify-content:center;font-size:16px">${['REPORT','PRIORITIZE','COLLECT','VERIFY'].map(x=>`<span class="on">${x}</span>`).join(' → ')}</div><div class="g">${stat('Total Reports',s.t)}${stat('Resolved Issues',s.res)}${stat('Pickup Requests',s.pk)}${stat('Active Hotspots',AL().filter(a=>area(a).n>=2).length)}</div>
 <div class="card"><h3>Cleanliness Pulse</h3><p style="font-size:22px">${lv}</p><small>🟢 Low · 🟡 Moderate · 🔴 High — based on pending complaint ratio</small></div></div>`};
const vLogin=()=>`<div class="wrap" style="max-width:440px"><h2>♻️ Login</h2><div class="card">${S.pend?`<div class="warn">Login as Citizen to report ${S.pend}</div>`:''}<label>Role</label><select id="lr" onchange="$('#cb').textContent='Create '+this.options[this.selectedIndex].text+' Account'"><option value="citizen">Citizen</option><option value="admin">Admin</option><option value="collector">Collector</option></select><label>Email / User ID</label><input id="le"><label>Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()">
 <div class="row"><button class="btn" onclick="login()">Login</button><button class="btn o" id="cb" onclick="S.rr=$('#lr').value;S.page='reg';render()">Create Citizen Account</button><button class="btn o" onclick="toast('Password reset link sent to your email')">Forgot Password</button></div></div>
 
 <a href="#" onclick="event.preventDefault();localStorage.removeItem('${K}');location.reload()">Clear all data</a> · <a href="#" onclick="event.preventDefault();S.page='landing';render()">Home</a></div>`;
const vReg=()=>{const r=S.rr||'citizen',R=r[0].toUpperCase()+r.slice(1);return`<div class="wrap" style="max-width:520px"><h2>Create ${R} Account</h2><div class="card">${[['n','Full Name'],['e','Email'],['m','Mobile Number'],['p','Password','password'],['a','Address'],['ar','Area (type your area)'],['z','Pincode']].map(f=>`<label>${f[1]}</label><input id="r${f[0]}" type="${f[2]||'text'}">`).join('')}<div class="row"><button class="btn" onclick="register()">Register</button><button class="btn o" onclick="S.page='login';render()">Back</button></div></div></div>`};
function go(v,a){S.view=v;S.arg=a;render()}
function render(){if(STR){STR.getTracks().forEach(t=>t.stop());STR=null}H=[];IMG='';AI=null;const a=$('#app');
 if(S.page!='app')a.innerHTML=({landing:vLand,login:vLogin,reg:vReg})[S.page]();
 else{const u=S.user;a.innerHTML=`<div class="app"><nav class="side"><div class="brand">♻️ SmartWaste</div>${NAV[u.role].map(n=>`<a class="${S.view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')}<a onclick="logout()">🚪 Logout</a></nav><main>${V[u.role+'.'+S.view]()}</main></div>`}
 H.forEach(f=>f());window.scrollTo(0,0)}
/* ===== START: restore session, handle QR link (#bin=BIN-1024) ===== */
try{DB=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}DB=DB||seed();
const hb=(location.hash.match(/bin=(BIN-\d+)/)||[])[1],su=DB.u.find(x=>x.id==DB.s);
if(su){S.user=su;S.page='app';S.view=su.role=='collector'?'tasks':'dash';if(hb&&su.role=='citizen'){S.view='report';S.arg=hb}}else if(hb){S.pend=hb;S.page='login'}
let t0;try{t0=localStorage.getItem('swm-theme')}catch(e){}theme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
render();
</script></body></html>
